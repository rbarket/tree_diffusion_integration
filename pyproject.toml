[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tree_diffusion_integration"
version = "0.1.0"
description = "Tree diffusion for symbolic integration: phase 1 dataset prep and symbolic evaluation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "pyarrow",
    "sympy",
    "torch",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
namespaces = true
